name: Bug report
description: Something doesn't work, or reads a page badly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste your Sarvam API key anywhere in this form.
        Security problems go through private reporting instead; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page where it happened, if it's public.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Read
        - Podcast
        - Summary
        - Settings page
        - Not sure
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Firefox 144, Safari 26.1…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions or about:addons, or the release you downloaded.
      placeholder: 0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Errors or screenshots
      description: Console errors from the page or the extension's background page, and screenshots if they help.
