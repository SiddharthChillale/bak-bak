name: Release

# Push a tag that matches package.json's version (e.g. v0.1.0) to publish a release
# with ready-to-load packs for Chrome, Firefox and Safari.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm compile
      - run: pnpm test

      - name: Build release packs
        run: pnpm zip:all

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/{{version}}/$version/g" .github/release-notes.md > notes.md
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" .output/*.zip \
            --title "Bak-Bak $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease
