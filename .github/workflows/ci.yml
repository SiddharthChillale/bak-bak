name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - name: Build Chrome, Firefox and Safari
        run: pnpm zip:all
      - uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: .output/*.zip
          retention-days: 14
