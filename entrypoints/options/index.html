<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Read Aloud: Settings &amp; Voice Lab</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Read Aloud: Settings &amp; Voice Lab <small>(Phase 0 spike)</small></h1>

      <section>
        <h2>Sarvam</h2>
        <label>API key
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk_…" />
        </label>
        <p class="hint">Stored in this browser's local extension storage only. Get one at dashboard.sarvam.ai.</p>
        <div class="grid">
          <label>Model
            <select id="model">
              <option value="bulbul:v4-flash">bulbul:v4-flash</option>
              <option value="bulbul:v3">bulbul:v3</option>
            </select>
          </label>
          <label>Voice <select id="voice"></select></label>
          <label>Transport
            <select id="transport">
              <option value="stream">stream (HTTP stream)</option>
              <option value="rest">rest</option>
            </select>
          </label>
          <label>Pace <input id="pace" type="number" min="0.5" max="2" step="0.05" /></label>
        </div>
        <p id="saved" class="hint" aria-live="polite"></p>
      </section>

      <section>
        <h2>Voice lab</h2>
        <label>Sample text
          <textarea id="sample" rows="3">The monsoon arrived early this year, and with it came a quiet relief across the city. Shopkeepers rolled up their shutters at 7:30 a.m., chai stalls filled up by eight, and the traffic on MG Road was, for once, almost bearable.</textarea>
        </label>
        <p class="hint" id="cost"></p>
        <div class="row">
          <button id="play">▶ Play selected voice</button>
          <button id="audition">▶ Audition reading shortlist</button>
          <button id="latency">⏱ Latency test (REST vs stream ×3)</button>
          <button id="stop">■ Stop</button>
        </div>
        <table>
          <thead><tr><th>Voice</th><th>Transport</th><th>Headers</th><th>First byte</th><th>Total</th><th>Audio</th><th></th></tr></thead>
          <tbody id="results"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
